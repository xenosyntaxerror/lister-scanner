<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f96302">
<title>Lister Scanner</title>
<!--
  Liquid Bidding Lister -- phone scanner page (hosted on GitHub Pages).

  The phone reads the barcode itself (zxing-wasm, live from the camera) and
  posts the code to a private ntfy.sh topic. The Lister on the PC keeps an
  outgoing connection open to that same topic, so it receives the code
  without ever accepting an incoming connection (which work firewalls
  block). The Lister then answers on "<topic>-ack" so this page can show
  whether the item was actually opened on the PC.

  The topic comes from the QR code the Lister shows, in the part of the URL
  after "#" -- browsers never send that part to GitHub's servers. It's saved
  in this phone's browser so a bookmark/home-screen icon keeps working.
-->
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --text: #1d1f23; --muted: #666b75; --border: #d6d9de;
    --accent: #f96302; --accent-dark: #c94f00; --ok: #1e9e57; --err: #d0342c; --warn: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171a; --panel: #1f2226; --text: #eceef1; --muted: #9aa0a8; --border: #33373d; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 19px; margin: 2px 0 12px; }
  .label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; }
  .stores { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .store {
    padding: 13px 8px; border-radius: 12px; border: 2px solid var(--border); background: var(--panel);
    color: var(--text); font-size: 15px; font-weight: 700;
  }
  .store[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-dark); color: #fff; }

  .viewer {
    position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden;
    background: #000; margin-bottom: 8px;
  }
  .viewer video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .guide {
    position: absolute; left: 8%; right: 8%; top: 30%; bottom: 30%;
    border: 3px solid rgba(255,255,255,.85); border-radius: 10px; box-shadow: 0 0 0 999px rgba(0,0,0,.28);
    transition: border-color .15s ease, background .15s ease;
  }
  .guide.hit { border-color: #2ee07f; background: rgba(46,224,127,.18); }
  .viewer-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 20px; color: #fff; font-size: 17px; font-weight: 600; background: rgba(0,0,0,.55);
  }
  .viewer-msg[hidden] { display: none; }
  .viewer-msg button {
    margin-top: 12px; padding: 12px 22px; border-radius: 10px; border: 0; background: var(--accent);
    color: #fff; font-size: 17px; font-weight: 700;
  }
  .torch {
    position: absolute; right: 10px; bottom: 10px; padding: 8px 12px; border-radius: 999px; border: 0;
    background: rgba(0,0,0,.55); color: #fff; font-size: 14px; font-weight: 600;
  }
  .torch[hidden] { display: none; }
  .status-line { min-height: 22px; font-size: 15px; font-weight: 600; margin: 0 2px 12px; }
  .status-line.ok { color: var(--ok); }
  .status-line.err { color: var(--err); }

  .row { display: flex; gap: 8px; margin-bottom: 16px; }
  .row input {
    flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 17px;
  }
  .btn-outline {
    padding: 0 16px; min-height: 46px; border-radius: 10px; border: 1px solid var(--accent-dark);
    background: var(--panel); color: var(--accent); font-size: 16px; font-weight: 700;
  }
  .photo-btn { width: 100%; margin-bottom: 16px; }
  #photoInput { display: none; }

  .log { display: flex; flex-direction: column; gap: 8px; }
  .entry { padding: 10px 12px; border-radius: 10px; background: var(--panel); border-left: 5px solid var(--border); }
  .entry.ok { border-left-color: var(--ok); }
  .entry.err { border-left-color: var(--err); }
  .entry.wait { border-left-color: var(--warn); }
  .entry .code { font-weight: 700; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .entry .msg { font-size: 14px; overflow-wrap: anywhere; }
  .entry .meta { font-size: 12px; color: var(--muted); }
  .setup { padding: 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); }
</style>
</head>
<body>
  <h1>Liquid Bidding Scanner</h1>

  <div id="setupNeeded" class="setup" hidden>
    <strong>Not paired yet.</strong>
    <p>On the PC, open the Lister and click <b>Phone Scanner&hellip;</b>, then scan its QR code with this phone's camera.</p>
  </div>

  <div id="main" hidden>
    <p class="label">Item is from</p>
    <div class="stores" id="stores"></div>

    <div class="viewer">
      <video id="video" playsinline muted autoplay></video>
      <div id="guide" class="guide"></div>
      <button id="torchBtn" class="torch" type="button" hidden>Light</button>
      <div id="viewerMsg" class="viewer-msg">
        <div>
          <div id="viewerMsgText">Point the camera at a barcode.</div>
          <button id="startBtn" type="button">Start camera</button>
        </div>
      </div>
    </div>
    <div id="statusLine" class="status-line">Line the barcode up inside the box.</div>

    <button id="photoBtn" class="btn-outline photo-btn" type="button">Take a photo instead</button>
    <input id="photoInput" type="file" accept="image/*" capture="environment">

    <p class="label">Or type it</p>
    <form class="row" id="manualForm" autocomplete="off">
      <input id="manualInput" type="text" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="UPC or product name">
      <button class="btn-outline" type="submit">Send</button>
    </form>

    <p class="label">Sent to the Lister</p>
    <div class="log" id="log"></div>
  </div>

<script type="module">
  import { readBarcodes } from "https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/es/reader/index.js";

  const RELAY = "https://ntfy.sh/";
  const SOURCES = [{ id: "homedepot", label: "Home Depot" }, { id: "amazon", label: "Amazon" }, { id: "walmart", label: "Walmart" }];
  const FORMATS = ["UPC-A", "UPC-E", "EAN-13", "EAN-8", "Code128", "Code39"];
  const SAME_CODE_COOLDOWN_MS = 8000;   // holding the camera on one item shouldn't send it over and over
  const ACK_TIMEOUT_MS = 10000;
  const $ = (id) => document.getElementById(id);

  // ---- pairing ------------------------------------------------------------
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  const fromHash = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
  if (/^[A-Za-z0-9_-]{16,64}$/.test(fromHash)) safeSet("listerTopic", fromHash);
  const topic = safeGet("listerTopic");
  if (topic && !fromHash) history.replaceState(null, "", "#" + topic);  // keep bookmarks working

  // ---- picking the right code ----------------------------------------------
  // Same rules as the Lister uses: a box/label can carry several barcodes, so
  // pick the one this store can actually look up.
  const ASIN_RE = /^[A-Z0-9]{10}$/;
  const FNSKU_RE = /^X0[A-Z0-9]{8}$/;
  const LPN_RE = /^LPN[A-Z0-9]+$/;
  const RETAIL = new Set(["UPC-A", "UPC-E", "EAN-13", "EAN-8"]);

  function normalizeRetail(text) {
    return text.length === 13 && text.startsWith("0") ? text.slice(1) : text;
  }

  function chooseCode(results, source) {
    const retail = results.filter((r) => RETAIL.has(r.format) && /^\d+$/.test(r.text)).map((r) => normalizeRetail(r.text));
    const others = results.filter((r) => !RETAIL.has(r.format)).map((r) => r.text.trim().toUpperCase());
    if (source === "amazon") {
      const asin = others.find((t) => ASIN_RE.test(t) && /[A-Z]/.test(t) && !FNSKU_RE.test(t));
      if (asin) return { code: asin };
      if (retail.length) return { code: retail[0] };
      if (others.some((t) => FNSKU_RE.test(t))) return { error: "That's an Amazon X00 sticker, which Amazon can't look up. Type the product name printed on it below instead.", key: "fnsku" };
      if (others.some((t) => LPN_RE.test(t))) return { error: "That's an Amazon LPN return label. Look for the item's UPC, or type the product name below.", key: "lpn" };
      return null;
    }
    if (retail.length) return { code: retail[0] };
    if (others.some((t) => ASIN_RE.test(t) && t.startsWith("B0"))) return { error: "That looks like an Amazon ASIN. Switch to Amazon if this is an Amazon item.", key: "asin-in-hd" };
    return others.length ? { code: others[0] } : null;
  }

  // ---- sending + acknowledgements ----------------------------------------
  const pending = new Map();  // scan id -> { entry, timer }

  function listenForAcks() {
    const events = new EventSource(RELAY + encodeURIComponent(topic + "-ack") + "/sse");
    events.onmessage = (event) => {
      let ack;
      try { ack = JSON.parse(JSON.parse(event.data).message); } catch (e) { return; }
      const item = pending.get(ack.id);
      if (!item) return;
      clearTimeout(item.timer);
      pending.delete(ack.id);
      setEntry(item.entry, ack.ok ? "ok" : "err", ack.message);
      buzz(ack.ok);
    };
  }

  let source = safeGet("scanSource") || "homedepot";
  if (!SOURCES.some((s) => s.id === source)) source = "homedepot";
  let lastSent = { code: null, at: 0 };

  async function send(code, how) {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const usedSource = source;
    const entry = addEntry(code, usedSource, how);
    try {
      const response = await fetch(RELAY + encodeURIComponent(topic), {
        method: "POST",
        body: JSON.stringify({ id, code, source: usedSource }),
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
    } catch (e) {
      setEntry(entry, "err", "Couldn't send. Check this phone's internet connection and try again.");
      buzz(false);
      return;
    }
    setEntry(entry, "wait", "Sent, waiting for the Lister...");
    pending.set(id, {
      entry,
      timer: setTimeout(() => {
        pending.delete(id);
        setEntry(entry, "err", "The Lister didn't answer. Is it open on the PC? (Scan it again once it is.)");
        buzz(false);
      }, ACK_TIMEOUT_MS),
    });
  }

  // ---- UI helpers -----------------------------------------------------------
  function storeLabel(id) { return (SOURCES.find((s) => s.id === id) || {}).label || id; }

  function addEntry(code, storeId, how) {
    const row = document.createElement("div");
    row.className = "entry wait";
    row.innerHTML = '<div class="code"></div><div class="msg"></div><div class="meta"></div>';
    row.querySelector(".code").textContent = code;
    row.querySelector(".meta").textContent =
      storeLabel(storeId) + " · " + how + " · " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    setEntry(row, "wait", "Sending...");
    $("log").prepend(row);
    return row;
  }

  function setEntry(row, kind, message) {
    row.className = "entry " + kind;
    row.querySelector(".msg").textContent = (kind === "ok" ? "✓ " : kind === "err" ? "✗ " : "") + message;
  }

  function setStatus(text, kind) {
    const line = $("statusLine");
    line.textContent = text;
    line.className = "status-line" + (kind ? " " + kind : "");
  }

  function buzz(ok) { if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]); }

  function renderStores() {
    const box = $("stores");
    box.innerHTML = "";
    SOURCES.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "store";
      b.textContent = s.label;
      b.setAttribute("aria-pressed", String(s.id === source));
      b.addEventListener("click", () => {
        source = s.id;
        safeSet("scanSource", source);
        lastSent = { code: null, at: 0 };
        renderStores();
      });
      box.appendChild(b);
    });
    $("manualInput").placeholder = { amazon: "ASIN, UPC, or product name", walmart: "UPC, Walmart item #, or product name" }[source] || "UPC or product name";
  }

  // ---- camera scanning ------------------------------------------------------
  let stream = null;
  let scanning = false;
  let pausedUntil = 0;
  let lastError = { key: null, at: 0 };
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  async function startCamera() {
    $("viewerMsgText").textContent = "Starting camera...";
    $("startBtn").hidden = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      });
    } catch (e) {
      $("viewerMsgText").textContent = "Camera not available (" + (e.name || "blocked") + "). Allow camera access for this page, or use \"Take a photo instead\".";
      $("startBtn").hidden = false;
      $("startBtn").textContent = "Try again";
      return;
    }
    const video = $("video");
    video.srcObject = stream;
    await video.play().catch(() => {});
    $("viewerMsg").hidden = true;
    setupTorch();
    scanning = true;
    scanLoop();
  }

  function setupTorch() {
    const track = stream && stream.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.torch) return;
    let on = false;
    $("torchBtn").hidden = false;
    $("torchBtn").onclick = () => {
      on = !on;
      track.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
      $("torchBtn").textContent = on ? "Light off" : "Light";
    };
  }

  // Reads only the area inside the on-screen guide box (plus a margin), so a
  // neighbouring item's barcode at the edge of the frame doesn't get sent.
  async function scanLoop() {
    const video = $("video");
    while (scanning) {
      if (document.hidden || Date.now() < pausedUntil || !video.videoWidth) {
        await sleep(200);
        continue;
      }
      const vw = video.videoWidth, vh = video.videoHeight;
      const sx = Math.round(vw * 0.04), sw = Math.round(vw * 0.92);
      const sy = Math.round(vh * 0.22), sh = Math.round(vh * 0.56);
      canvas.width = sw;
      canvas.height = sh;
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
      let results = [];
      try {
        results = await readBarcodes(ctx.getImageData(0, 0, sw, sh), { formats: FORMATS, tryHarder: true, maxNumberOfSymbols: 4 });
      } catch (e) {
        await sleep(300);
        continue;
      }
      handleResults(results.filter((r) => r.isValid), "camera");
      await sleep(90);
    }
  }

  function handleResults(results, how) {
    if (!results.length) return false;
    const choice = chooseCode(results, source);
    if (!choice) return false;
    if (choice.error) {
      if (lastError.key !== choice.key || Date.now() - lastError.at > 5000) {
        setStatus(choice.error, "err");
        buzz(false);
      }
      lastError = { key: choice.key, at: Date.now() };
      return true;
    }
    if (choice.code === lastSent.code && Date.now() - lastSent.at < SAME_CODE_COOLDOWN_MS) return true;
    lastSent = { code: choice.code, at: Date.now() };
    flashHit();
    setStatus("Read " + choice.code + ", sent. Next item!", "ok");
    pausedUntil = Date.now() + 1200;
    send(choice.code, how);
    return true;
  }

  function flashHit() {
    $("guide").classList.add("hit");
    setTimeout(() => $("guide").classList.remove("hit"), 600);
  }

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  // ---- init -----------------------------------------------------------------
  function init() {
    renderStores();
    listenForAcks();

    $("startBtn").addEventListener("click", startCamera);
    // Most browsers allow starting straight away once camera permission has
    // been granted before; if not, the "Start camera" button is the fallback.
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: "camera" }).then((p) => { if (p.state === "granted") startCamera(); }).catch(() => {});
    }

    $("photoBtn").addEventListener("click", () => $("photoInput").click());
    $("photoInput").addEventListener("change", async function () {
      const file = this.files && this.files[0];
      this.value = "";
      if (!file) return;
      setStatus("Reading photo...");
      try {
        const results = (await readBarcodes(file, { formats: FORMATS, tryHarder: true, maxNumberOfSymbols: 6 })).filter((r) => r.isValid);
        lastSent = { code: null, at: 0 };
        if (!handleResults(results, "photo")) {
          setStatus("No barcode found in that photo. Get closer and avoid glare.", "err");
          buzz(false);
        }
      } catch (e) {
        setStatus("Couldn't read that photo. Try again.", "err");
      }
    });

    $("manualForm").addEventListener("submit", (event) => {
      event.preventDefault();
      // Codes go uppercase; a product name (anything with a space) is sent
      // as typed and becomes a store search on the PC.
      const raw = $("manualInput").value.trim().replace(/\s+/g, " ");
      const code = /\s/.test(raw) ? raw : raw.toUpperCase();
      if (!code) return;
      $("manualInput").value = "";
      send(code, "typed");
    });
  }

  // Last, so every const/let above already exists when init() runs.
  if (!topic) {
    $("setupNeeded").hidden = false;
  } else {
    $("main").hidden = false;
    init();
  }
</script>
</body>
</html>
